name: release

on:
  push:
    branches: [main]
    paths-ignore: ['.github/**']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: coop-verbump-release
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: TheKathan/trunk-semver@bdfa679941c534feeb98f967803cff48cdc3455e # v1.0.14
        id: version
        with:
          major-version: "1"
          add-to-summary: "true"

      - name: Tag the version and move the major tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag -f "$VERSION"
          git tag -f "${VERSION%%.*}"
          git push --force origin "refs/tags/$VERSION" "refs/tags/${VERSION%%.*}"

      - name: Install the GitHub CLI
        env:
          GH_CLI_VERSION: 2.103.3
        run: |
          set -euo pipefail
          if command -v gh >/dev/null; then gh --version | head -1; exit 0; fi
          d="$RUNNER_TEMP/gh-cli" && mkdir -p "$d" && cd "$d"
          base="https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}"
          tarball="gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/gh_${GH_CLI_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "$tarball"
          echo "$d/gh_${GH_CLI_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists"
            exit 0
          fi
          gh release create "$VERSION" --title "$VERSION" --generate-notes --verify-tag
